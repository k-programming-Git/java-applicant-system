<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ID管理</title>
<style>
body{ font-family: Arial; margin:40px; background:#f5f5f5; }
label{ display:block; margin-top:15px; }
input{ padding:6px; border:1px solid #ccc; border-radius:5px; width:250px; }
button{ margin-top:20px; padding:8px 14px; background:#3498db; color:white; border:none; border-radius:5px; cursor:pointer; }
.message{ color:red; }
</style>
</head>
<body>

<!-- user.id が null なら新規登録、値があれば編集 -->
<h1 th:text="${user.id == null} ? 'ID登録' : 'ID編集'">ID登録</h1>

<p class="message" th:if="${message}" th:text="${message}"></p>

<form th:action="${user.id == null} ? @{/users} : @{/users/{id}(id=${user.id})}"
      th:object="${user}" method="post">

    <label>IDコード</label>
    <input type="text" th:field="*{userCd}" maxlength="20">

    <label>ユーザー名</label>
    <input type="text" th:field="*{userName}" maxlength="100">

    <br>
    <button type="submit" th:text="${user.id == null} ? '登録' : '更新'">登録</button>
</form>

<p><a th:href="@{/users}">一覧へ戻る</a></p>

</body>
</html>
