<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>社員一覧</title>
<style>
body{ font-family: Arial; margin:40px; background:#f5f5f5; }
.search-form{ margin-bottom:20px; padding:20px; background:white; width:760px; }
.search-form div{ margin-bottom:10px; }
.search-form label{ display:inline-block; width:100px; }

.search-form input{ width:250px; padding:6px; }
.search-form button{ padding:8px 20px; }

.search-input-wrapper{
    display:inline-flex;
    align-items:center;
    gap:6px;
}

.clear-button{
    width:30px;
    height:30px;
    padding:0 !important;
    border:1px solid #ccc;
    border-radius:50%;
    background:#f5f5f5;
    color:#555;
    font-size:18px;
    line-height:1;
    cursor:pointer;
}

.clear-button:hover{
    background:#e0e0e0;
}

table{ border-collapse:collapse; width:800px; background:white; }
th,td{ padding:10px; text-align:left; border-bottom:1px solid #ddd; }
th{ background:#eeeeee; }
a{ margin-right:10px; text-decoration:none; }
</style>
</head>
<body>

<h1>社員一覧</h1>

<form th:action="@{/employees}" method="get" class="search-form">

   
<div>
    <label for="employeeCd">社員コード</label>
    <span class="search-input-wrapper">
        <input type="text"
               id="employeeCd"
               name="employeeCd"
               maxlength="20"
               th:value="${employeeCd}">
        <button type="button"
                class="clear-button"
                aria-label="社員コードをクリア"
                onclick="clearSearchInput('employeeCd')">×</button>
    </span>
</div>


    
<div>
    <label for="employeeName">社員名</label>
    <span class="search-input-wrapper">
        <input type="text"
               id="employeeName"
               name="employeeName"
               maxlength="100"
               th:value="${employeeName}">
        <button type="button"
                class="clear-button"
                aria-label="社員名をクリア"
                onclick="clearSearchInput('employeeName')">×</button>
    </span>
</div>


    <button type="submit">検索</button>

</form>

<p>
    <a th:href="@{/employees/new}">社員登録</a>
</p>

<table>
<tr>
    <th>社員コード</th>
    <th>社員名</th>
    <th>メールアドレス</th>
    <th>入社日</th>
    <th>退職日</th>
</tr>
<tr th:each="employee : ${employees}">
  <td>
    <a th:href="@{/employees/{id}(id=${employee.id})}"
       th:text="${employee.employeeCd}">
    </a>
</td>
    <td th:text="${employee.employeeName}"></td>
    <td th:text="${employee.email}"></td>
    <td th:text="${#temporals.format(employee.hireDate, 'yyyy/MM/dd')}"></td>
    <td th:text="${employee.retireDate != null ? #temporals.format(employee.retireDate, 'yyyy/MM/dd') : ''}"></td>
</tr>
</table>

<p th:if="${#lists.isEmpty(employees)}">該当する社員はいません</p>

<p><a th:href="@{/}">ホームへ戻る</a></p>


<script>
function clearSearchInput(inputId) {
    const input = document.getElementById(inputId);
    input.value = "";
    input.focus();
}
</script>

</body>
</html>
