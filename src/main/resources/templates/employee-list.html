<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>社員一覧</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background: #f5f5f5;
    color: #333;
}

.search-form {
    margin-bottom: 20px;
    padding: 20px;
    background: white;
    width: 760px;
    box-sizing: border-box;
    border-radius: 6px;
}

.search-form div {
    margin-bottom: 10px;
}

.search-form label {
    display: inline-block;
    width: 100px;
}

.search-form input {
    width: 250px;
    padding: 6px;
    box-sizing: border-box;
}

.search-input-wrapper {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

button,
.action-link {
    display: inline-block;
    padding: 8px 20px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    box-sizing: border-box;
}

.primary-button {
    background: #2563eb;
    color: white;
}

.primary-button:hover {
    background: #1d4ed8;
}

.secondary-button {
    background: #e5e7eb;
    color: #1f2937;
}

.secondary-button:hover {
    background: #d1d5db;
}

.clear-button {
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid #ccc;
    border-radius: 50%;
    background: #f5f5f5;
    color: #555;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
}

.clear-button:hover {
    background: #e0e0e0;
}

table {
    border-collapse: collapse;
    width: 800px;
    background: white;
}

th,
td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid #ddd;
}

th {
    background: #eeeeee;
}

a {
    margin-right: 10px;
    text-decoration: none;
}

table a {
    color: #2563eb;
}

table a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>

<h1>社員一覧</h1>

<form th:action="@{/employees}" method="get" class="search-form">

   
<div>
    <label for="employeeCd">社員コード</label>
    <span class="search-input-wrapper">
        <input type="text"
               id="employeeCd"
               name="employeeCd"
               maxlength="20"
               th:value="${employeeCd}">
        <button type="button"
                class="clear-button"
                aria-label="社員コードをクリア"
                onclick="clearSearchInput('employeeCd')">×</button>
    </span>
</div>


    
<div>
    <label for="employeeName">社員名</label>
    <span class="search-input-wrapper">
        <input type="text"
               id="employeeName"
               name="employeeName"
               maxlength="100"
               th:value="${employeeName}">
        <button type="button"
                class="clear-button"
                aria-label="社員名をクリア"
                onclick="clearSearchInput('employeeName')">×</button>
    </span>
</div>


    <button type="submit" class="primary-button">検索</button>

</form>

<p>
    <a th:href="@{/employees/new}" class="action-link primary-button">社員登録</a>
</p>

<table>
<tr>
    <th>社員コード</th>
    <th>社員名</th>
    <th>メールアドレス</th>
    <th>入社日</th>
    <th>退職日</th>
</tr>
<tr th:each="employee : ${employees}">
  <td>
    <a th:href="@{/employees/{id}(id=${employee.id})}"
       th:text="${employee.employeeCd}">
    </a>
</td>
    <td th:text="${employee.employeeName}"></td>
    <td th:text="${employee.email}"></td>
    <td th:text="${#temporals.format(employee.hireDate, 'yyyy/MM/dd')}"></td>
    <td th:text="${employee.retireDate != null ? #temporals.format(employee.retireDate, 'yyyy/MM/dd') : ''}"></td>
</tr>
</table>

<p th:if="${#lists.isEmpty(employees)}">該当する社員はいません</p>

<p><a th:href="@{/}" clas="action-link secondary-button">ホームへ戻る</a></p>


<script>
function clearSearchInput(inputId) {
    const input = document.getElementById(inputId);
    input.value = "";
    input.focus();
}
</script>

</body>
</html>
