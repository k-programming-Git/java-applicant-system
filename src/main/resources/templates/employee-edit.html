
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>社員編集</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background: #f5f5f5;
    color: #333;
}

.form-container {
    width: 600px;
    padding: 20px;
    background: white;
    box-sizing: border-box;
    border-radius: 6px;
}

.form-row {
    margin-bottom: 15px;
}

.form-row label {
    display: inline-block;
    width: 140px;
}

.form-row input {
    width: 300px;
    padding: 6px;
    box-sizing: border-box;
}

.form-input-wrapper {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.clear-button {
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid #ccc;
    border-radius: 50%;
    background: #f5f5f5;
    color: #555;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
}

.clear-button:hover {
    background: #e0e0e0;
}

/* 共通ボタン */
.buttons button,
.buttons a {
    display: inline-block;
    padding: 8px 20px;
    margin-right: 10px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    box-sizing: border-box;
}

.primary-button {
    background: #2563eb;
    color: white;
}

.primary-button:hover {
    background: #1d4ed8;
}

.secondary-button {
    background: #e5e7eb;
    color: #1f2937;
}

.secondary-button:hover {
    background: #d1d5db;
}

.error {
    color: red;
    margin-top: 5px;
}

.buttons {
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>社員編集</h1>

<div class="form-container">

<form th:action="@{/employees/{id}(id=${employee.id})}"
      th:object="${employee}"
      method="post">

    <!-- 社員コード：変更不可 -->
    <div class="form-row">
        <label>社員コード</label>
        <span th:text="${employee.employeeCd}"></span>

        <input type="hidden" th:field="*{employeeCd}">
    </div>

    <!-- 社員名 -->
    <div class="form-row">
        <label for="employeeName">社員名</label>

        <span class="form-input-wrapper">
            <input type="text"
                   id="employeeName"
                   th:field="*{employeeName}"
                   maxlength="100">

            <button type="button"
                    class="clear-button"
                    aria-label="社員名をクリア"
                    onclick="clearFormInput('employeeName')">×</button>
        </span>

        <div class="error"
             th:if="${#fields.hasErrors('employeeName')}"
             th:errors="*{employeeName}">
        </div>
    </div>

    <!-- メールアドレス -->
    <div class="form-row">
        <label for="email">メールアドレス</label>

        <span class="form-input-wrapper">
            <input type="email"
                   id="email"
                   th:field="*{email}"
                   maxlength="255">

            <button type="button"
                    class="clear-button"
                    aria-label="メールアドレスをクリア"
                    onclick="clearFormInput('email')">×</button>
        </span>

        <div class="error"
             th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}">
        </div>
    </div>

    <!-- 入社日 -->
    <div class="form-row">
        <label for="hireDate">入社日</label>

        <span class="form-input-wrapper">
            <input type="date"
                   id="hireDate"
                   th:field="*{hireDate}">

            <button type="button"
                    class="clear-button"
                    aria-label="入社日をクリア"
                    onclick="clearFormInput('hireDate')">×</button>
        </span>

        <div class="error"
             th:if="${#fields.hasErrors('hireDate')}"
             th:errors="*{hireDate}">
        </div>
    </div>

    <!-- 退職日 -->
    <div class="form-row">
        <label for="retireDate">退職日</label>

        <span class="form-input-wrapper">
            <input type="date"
                   id="retireDate"
                   th:field="*{retireDate}">

            <button type="button"
                    class="clear-button"
                    aria-label="退職日をクリア"
                    onclick="clearFormInput('retireDate')">×</button>
        </span>

        <div class="error"
             th:if="${#fields.hasErrors('retireDate')}"
             th:errors="*{retireDate}">
        </div>
    </div>

    <!-- 操作ボタン -->
    <div class="buttons">
        <button type="submit" class="primary-button">更新</button>

        <a th:href="@{/employees/{id}(id=${employee.id})}"
            class="secondary-button">
            社員詳細へ戻る
        </a>
    </div>

</form>

</div>

<script>
function clearFormInput(inputId) {
    const input = document.getElementById(inputId);
    input.value = "";
    input.focus();
}
</script>

</body>
</html>
