<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>社員詳細</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background: #f5f5f5;
    color: #333;
}

.detail-container {
    width: 600px;
    padding: 20px;
    background: white;
    box-sizing: border-box;
    border-radius: 6px;
}

.detail-row {
    margin-bottom: 15px;
}

.detail-row label {
    display: inline-block;
    width: 140px;
}

/* 共通ボタン */
.buttons button,
.buttons a {
    display: inline-block;
    padding: 8px 20px;
    margin-right: 10px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    box-sizing: border-box;
}

.primary-button {
    background: #2563eb;
    color: white;
}

.primary-button:hover {
    background: #1d4ed8;
}

.danger-button {
    background: #dc2626;
    color: white;
}

.danger-button:hover {
    background: #b91c1c;
}

.secondary-button {
    background: #e5e7eb;
    color: #1f2937;
}

.secondary-button:hover {
    background: #d1d5db;
}

.buttons {
    margin-top: 20px;
}
</style>
</head>
<body>

<h1>社員詳細</h1>

<div class="detail-container">

    <div class="detail-row">
        <label>社員コード</label>
        <span th:text="${employee.employeeCd}"></span>
    </div>

    <div class="detail-row">
        <label>社員名</label>
        <span th:text="${employee.employeeName}"></span>
    </div>

    <div class="detail-row">
        <label>メールアドレス</label>
        <span th:text="${employee.email}"></span>
    </div>

    <div class="detail-row">
        <label>入社日</label>
        <span th:text="${#temporals.format(employee.hireDate, 'yyyy/MM/dd')}"></span>
    </div>

    <div class="detail-row">
        <label>退職日</label>
        <span th:text="${employee.retireDate != null ? #temporals.format(employee.retireDate, 'yyyy/MM/dd') : ''}"></span>
    </div>
 
<div class="buttons">
    <a th:href="@{/employees/{id}/edit(id=${employee.id})}"
       class="primary-button">編集</a>

    <form th:action="@{/employees/{id}/delete(id=${employee.id})}"
          method="post"
          style="display:inline;"
          onsubmit="return confirm('この社員を削除しますか？');">
        <button type="submit" class="danger-button">削除</button>
    </form>

    <a th:href="@{/employees}"
       class="secondary-button">社員一覧へ戻る</a>
</div>


</div>

</body>
</html>
