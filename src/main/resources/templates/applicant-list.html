<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>応募者一覧</title>
<style>
body{ font-family: Arial; margin:40px; background:#f5f5f5; }
h1{ margin-bottom:5px; }
table{ border-collapse:collapse; width:500px; background:white; }
th,td{ padding:10px; text-align:left; border-bottom:1px solid #ddd; }
th{ background:#eeeeee; }
a{ margin-right:10px; text-decoration:none; }
input{ padding:6px; border:1px solid #ccc; border-radius:5px; }
button{ padding:8px 14px; background:#3498db; color:white; border:none; border-radius:5px; cursor:pointer; }
button:hover{ opacity:0.8; }
.message{ color:red; }
</style>
</head>
<body>

<h1>Applicant System</h1>
<h2>応募者一覧</h2>

<form th:action="@{/applicants/add}" method="get">
    <input type="text" name="name" placeholder="名前を入力して追加">
    <button type="submit">追加</button>
</form>

<p class="message" th:if="${message}" th:text="${message}"></p>
<br>

<form th:action="@{/applicants}" method="get">
    <input type="text" name="keyword" placeholder="名前を入力して検索">
    <button type="submit">検索</button>
</form>
<br>

<table border="1">
<tr>
    <th>名前</th>
    <th>操作</th>
</tr>
<tr th:each="applicant : ${applicants}">
    <td><span th:text="${applicant.name}"></span></td>
    <td>
        <a th:href="@{/applicants/edit(id=${applicant.id})}">編集</a>
        <a th:href="@{/applicants/delete(id=${applicant.id})}">削除</a>
    </td>
</tr>
</table>

<p th:if="${#lists.isEmpty(applicants)}">検索結果0件</p>

<p><a th:href="@{/}">ホームへ戻る</a></p>

</body>
</html>
